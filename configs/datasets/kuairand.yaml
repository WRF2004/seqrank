extends: ../research.yaml
adapter:
  kind: kuairand
  version: auto
  sources: ['${RAW_ROOT:-data/raw/KuaiRand-Pure}/log_standard*.csv']
  output: ${DATA_ROOT:-data/kuairand}/normalized.csv
  primary_label: valid_play
  policy: standard
  tab_semantics: {}
  loop_policy: keep
  outlier_policy: error
  max_watch_seconds: 86400
  feedback_delay_ms: 0
  user_sample_fraction: 1.0
  sample_seed: 42
