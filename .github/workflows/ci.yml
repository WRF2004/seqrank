name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev,ann]'
      - run: make lint test
      - run: make demo
      - name: CPU distributed smoke tests
        run: |
          python -m torch.distributed.run --standalone --nproc-per-node=2 -m seqrank.cli --threads 1 train --data data/prepared --out runs/ddp --stage retrieval --config configs/demo.yaml --device cpu
          python -m torch.distributed.run --standalone --nproc-per-node=2 -m seqrank.cli --threads 1 train --data data/prepared --out runs/ddp --stage ranker --config configs/demo.yaml --device cpu
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-metrics
          path: runs/demo/metrics.json
